name: CI/CD Deploy

on:
  push:
    tags:
      - 'v*.*'   # v1.0, v1.1, v2.0 gibi tag'lerde tetiklenir

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: berkantyilmaz0/ringeditorv2-api
  IMAGE_NAME_WEB: berkantyilmaz0/ringeditorv2-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ steps.get_version.outputs.version }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ steps.get_version.outputs.version }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. VPS üzerinde GHCR login yap (Özel paketleri çekebilmek için)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # 2. Proje klasörüne git
            cd /var/www/Ringeditorv2
            
            # 3. İlgili imaj sürümünü set et ve çek
            export IMAGE_TAG=${{ needs.build-and-push.outputs.version }}
            docker compose pull
            
            # 4. Servisleri yeniden başlat
            docker compose up -d --force-recreate
            sleep 10
            
            # 5. Doğru sürümle veritabanını güncelle
            docker exec api npx prisma@6.3.0 db push --accept-data-loss
            
            # 6. Eski imajları temizle
            docker image prune -af --filter "until=24h"
            echo "✅ Deployed version ${{ needs.build-and-push.outputs.version }}"
